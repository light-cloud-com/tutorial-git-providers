<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployed from Git</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved theme before the page paints, so it never flashes.
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
</head>
<body>
  <main>
    <button id="theme" type="button" aria-label="Switch between light and dark theme">Dark theme</button>
    <h1>Deployed from Git</h1>
    <p>This page is deployed by Light Cloud every time the main branch changes.</p>
    <p class="version">Version 2</p>
  </main>
  <script src="theme.js"></script>
</body>
</html>
